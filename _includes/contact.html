<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Contact Me</h2>
                <h3 class="section-subheading text-muted">Feel free to reach out at any time.</h3>
            </div>
        </div>

        <!-- Formspree form -->
        <form action="https://formspree.io/f/xblnkbwj" method="POST" id="contactForm">
            <div class="row">
                <!-- Left column: Name, Email, Subject -->
                <div class="col-md-6">
                    <div class="form-group">
                        <input type="text" name="name" class="form-control" placeholder="Your Name *" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="_replyto" class="form-control" placeholder="Your Email *" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="subject" class="form-control" placeholder="Subject *" required>
                    </div>
                </div>

                <!-- Right column: Message -->
                <div class="col-md-6">
                    <div class="form-group">
                        <textarea name="message" class="form-control" placeholder="Your Message *" required></textarea>
                    </div>
                </div>

                <!-- Submit button -->
                <div class="col-lg-12 text-center">
                    <button type="submit" class="btn btn-primary btn-xl">Send Message</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Map image -->
    <div class="map">
        <img src="{{ site.baseurl }}/img/map-image.png" class="img-responsive" alt="Map">
    </div>
</section>
