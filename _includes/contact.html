<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Contact Me</h2>
                <h3 class="section-subheading text-muted">Feel free to reach out at any time.</h3>
            </div>
        </div>

        <form id="contactForm" method="POST" action="https://formspree.io/f/xblnkbwj">
            <div class="row">
                <div class="col-md-6">
                    <input type="text" name="name" class="form-control" placeholder="Your Name *" required>
                    <input type="email" name="_replyto" class="form-control" placeholder="Your Email *" required>
                    <input type="text" name="subject" class="form-control" placeholder="Subject">
                </div>

                <div class="col-md-6">
                    <textarea name="message" class="form-control" placeholder="Your Message *" required></textarea>
                </div>

                <div class="col-lg-12 text-center">
                    <button type="submit" class="btn btn-xl">Send Message</button>
                </div>
            </div>
        </form>
    </div>

    <div class="map">
        <img src="{{ site.baseurl }}/img/map-image.png" class="img-responsive" alt="">
    </div>
</section>
